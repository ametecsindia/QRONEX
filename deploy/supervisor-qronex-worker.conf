; /etc/supervisor/conf.d/qronex-worker.conf  →  supervisorctl reread && supervisorctl update
; Sends webhooks and other queued jobs. Restarted automatically; `php artisan queue:restart` after each deploy.
[program:qronex-worker]
command=php /var/www/qronex/artisan queue:work database --sleep=3 --tries=1 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/qronex/storage/logs/worker.log
