# /etc/nginx/sites-available/qronex  →  ln -s ../sites-available/qronex /etc/nginx/sites-enabled/
# Certbot adds the 443 block + certificates:  certbot --nginx -d qronex.app -d www.qronex.app
server {
    listen 80;
    server_name qronex.app www.qronex.app;
    root /var/www/client_apps/qronex/public;
    index index.php;
    charset utf-8;
    client_max_body_size 5m;          # CSV imports, logos

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(css|js|png|jpg|svg|woff2?)$ { expires 30d; access_log off; try_files $uri =404; }
    location ~ /\.(?!well-known) { deny all; }   # .env, .git
    location = /favicon.ico { access_log off; log_not_found off; }
}
