name: qronex_app
description: QRONEX employee attendance app (scan the entrance QR to punch IN/OUT).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  mobile_scanner: ^6.0.2
  geolocator: ^13.0.2
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
