plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ametecs.qronex'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ametecs.qronex'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '1.0.0'
        buildConfigField 'String', 'SERVER_URL', '"https://qronex.app"'
    }

    buildTypes {
        debug {
            // Testing against your PC (http://<PC IP>:8000) needs plain HTTP; release builds are HTTPS only.
            manifestPlaceholders = [cleartext: 'true']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [cleartext: 'false']
            signingConfig signingConfigs.debug // ponytail: swap for your upload key before the Play Store (README)
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.13.1' // the scanner needs it but doesn't bundle it
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
